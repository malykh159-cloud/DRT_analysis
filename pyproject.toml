[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drt-analyzer"
version = "0.4.0"
description = "Transparent, reproducible EIS distribution of relaxation times analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "PySide6>=6.8", "pyqtgraph>=0.14", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.12"]

[project.scripts]
drt-analyzer = "drt_analyzer.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
